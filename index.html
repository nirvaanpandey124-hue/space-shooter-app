<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-title" content="Space Shooter">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" href="icon.png">
    <title>Space Shooter</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Arial, sans-serif;
            background: #000000;
            color: #ffffff;
            font-synthesis: none;
        }

        * { box-sizing: border-box; }

        body {
            min-width: 0;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            display: grid;
            place-items: center;
            background: #000000;
        }

        main {
            position: relative;
            width: min(100%, 100dvh, 600px);
        }

        .stage {
            position: relative;
            overflow: hidden;
            width: 100%;
            min-width: 0;
            margin-inline: auto;
            aspect-ratio: 1;
            background: #000000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .overlay {
            position: absolute;
            inset: 0;
            display: grid;
            align-content: center;
            justify-items: center;
            gap: 8px;
            padding: 0;
            background: transparent;
            text-align: center;
            pointer-events: none;
        }

        .overlay[hidden] { display: none; }

        .overlay h2 {
            margin: 0;
            font: bold 25px Arial, sans-serif;
            line-height: 1;
        }

        .overlay p {
            max-width: 28rem;
            margin: 0;
            color: #ffffff;
            font: 14px Arial, sans-serif;
        }

        button {
            min-height: 30px;
            border: 1px solid #ffffff;
            border-radius: 0;
            background: #000000;
            color: #ffffff;
            font: 12px Arial, sans-serif;
            cursor: pointer;
            touch-action: manipulation;
        }

        button:hover { background: #111111; }
        button:focus-visible { outline: 2px solid #ffffff; outline-offset: 2px; }

        .overlay button { min-width: 92px; padding: 0 10px; pointer-events: auto; }

        .overlay-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }

        .overlay .secondary-action {
            border-color: #ffffff;
            background: #000000;
            color: #ffffff;
        }

        .controls {
            position: absolute;
            right: 8px;
            bottom: 8px;
            z-index: 3;
            pointer-events: none;
        }

        .touch-controls {
            display: flex;
            gap: 4px;
            pointer-events: auto;
        }

        .touch-controls button {
            width: 34px;
            height: 28px;
            padding: 0;
            border: 0;
            background: #000000;
            color: #ffffff;
            font: 11px Arial, sans-serif;
            opacity: .72;
        }

        .touch-controls button[data-fire] { width: 42px; }
        .touch-controls button[data-action="pause"] { width: 38px; }

        @media (max-width: 480px) {
            .overlay h2 { font-size: 25px; }
        }
    </style>
</head>
<body>
    <main>
        <section class="stage" aria-label="Space Shooter game">
            <canvas id="game" width="600" height="600" aria-label="Game field"></canvas>
            <div class="overlay" id="paused-screen" hidden>
                <h2>PAUSED</h2>
            </div>
            <div class="overlay" id="game-over" hidden>
                <h2>GAME OVER</h2>
                <p id="final-score" hidden>Score: 0</p>
                <div class="overlay-actions">
                    <button id="restart-button" type="button">Play again</button>
                </div>
            </div>
        </section>

        <footer class="controls">
            <div class="touch-controls" aria-label="Touch controls">
                <button type="button" id="fire-button" data-fire aria-label="Hold to fire">Fire</button>
                <button type="button" id="pause-button" data-action="pause" aria-label="Pause game" aria-pressed="false">Pause</button>
            </div>
        </footer>
    </main>
    <script src="game.js" defer></script>
</body>
</html>
