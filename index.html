<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-title" content="Space Shooter">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
    <link rel="icon" href="icon.png?v=2">
    <title>Space Shooter</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Arial, sans-serif;
            background: #030711;
            color: #ffffff;
            font-synthesis: none;
        }

        * { box-sizing: border-box; }

        body {
            min-width: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            margin: 0;
            overflow: hidden;
            background: #030711;
        }

        main {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
        }

        .stage {
            position: absolute;
            inset: 0;
            overflow: hidden;
            background: #030711;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .overlay {
            position: absolute;
            inset: 0;
            display: grid;
            align-content: center;
            justify-items: center;
            gap: 8px;
            padding: 0;
            background: rgba(2, 6, 16, .58);
            backdrop-filter: blur(2px);
            text-align: center;
            pointer-events: none;
        }

        .overlay[hidden] { display: none; }

        .overlay h2 {
            margin: 0;
            color: #effaff;
            font: 700 clamp(38px, 8vw, 58px) Arial, sans-serif;
            line-height: 1;
            text-shadow: 0 0 18px rgba(73, 215, 255, .75);
        }

        .overlay p {
            max-width: 28rem;
            margin: 0;
            color: #ffffff;
            font: 16px Arial, sans-serif;
            text-shadow: 0 1px 4px #000000;
        }

        button {
            min-height: 38px;
            border: 1px solid rgba(206, 241, 255, .76);
            border-radius: 12px;
            background: #091728;
            color: #ffffff;
            font: 700 14px Arial, sans-serif;
            cursor: pointer;
            touch-action: manipulation;
            box-shadow: 0 0 12px rgba(50, 185, 255, .28), inset 0 0 10px rgba(52, 182, 255, .1);
            transition: background 120ms ease, box-shadow 120ms ease, transform 120ms ease;
        }

        button:hover { background: #102741; box-shadow: 0 0 18px rgba(50, 185, 255, .45); }
        button:active { transform: translateY(1px); }
        button:focus-visible { outline: 2px solid #ffffff; outline-offset: 2px; }

        .overlay button {
            min-width: 168px;
            min-height: 52px;
            padding: 0 22px;
            border-radius: 16px;
            border-color: #78e8ff;
            background: linear-gradient(180deg, #20bde9, #0873bb);
            color: #ffffff;
            font-size: 17px;
            box-shadow: 0 0 24px rgba(32, 189, 233, .52);
            pointer-events: auto;
        }

        .overlay button:hover { background: linear-gradient(180deg, #47d7fa, #118cda); }

        .overlay-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }

        .overlay .secondary-action {
            border-color: #ffffff;
            background: #000000;
            color: #ffffff;
        }

        .controls {
            position: absolute;
            inset: 0;
            z-index: 4;
            pointer-events: none;
        }

        .control-hint {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
        }

        .touch-controls {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: none;
        }

        .move-controls {
            left: calc(env(safe-area-inset-left, 0px) + 14px);
            bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
        }

        .action-controls {
            right: calc(env(safe-area-inset-right, 0px) + 14px);
            bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
        }

        .top-controls {
            top: calc(env(safe-area-inset-top, 0px) + 14px);
            right: calc(env(safe-area-inset-right, 0px) + 14px);
            gap: 8px;
        }

        .touch-controls button {
            width: 82px;
            height: 68px;
            padding: 0;
            border: 1px solid rgba(190, 232, 255, .72);
            border-radius: 16px;
            background: linear-gradient(180deg, #14283b, #081421);
            color: #ffffff;
            font: 700 15px Arial, sans-serif;
            box-shadow: 0 0 15px rgba(48, 166, 255, .22), inset 0 0 12px rgba(76, 197, 255, .09);
            pointer-events: auto;
        }

        .touch-controls button[data-fire] {
            width: 108px;
            height: 68px;
            border-color: #ffe17a;
            background: linear-gradient(180deg, #ffcb4d, #df751e);
            color: #241500;
            font-size: 17px;
            box-shadow: 0 0 20px rgba(255, 177, 50, .46), inset 0 0 12px rgba(255, 255, 220, .28);
        }

        .touch-controls button[data-action="pause"] {
            width: 82px;
            height: 68px;
            border-color: #79e9ff;
            background: linear-gradient(180deg, #178eb3, #075374);
            box-shadow: 0 0 18px rgba(49, 214, 255, .38), inset 0 0 12px rgba(196, 248, 255, .16);
        }

        .touch-controls button[data-action="menu"] {
            width: 82px;
            height: 68px;
            border-color: #79e9ff;
            background: linear-gradient(180deg, #178eb3, #075374);
            box-shadow: 0 0 18px rgba(49, 214, 255, .38), inset 0 0 12px rgba(196, 248, 255, .16);
        }

        .touch-controls button[data-move] {
            width: 100px;
            height: 90px;
            border-color: #79e9ff;
            background: linear-gradient(180deg, #178eb3, #075374);
            box-shadow: 0 0 18px rgba(49, 214, 255, .38), inset 0 0 12px rgba(196, 248, 255, .16);
            font-size: 50px;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .install-hint {
            position: fixed;
            z-index: 10;
            top: calc(env(safe-area-inset-top, 0px) + 8px);
            left: 50%;
            right: auto;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: min(340px, calc(100vw - 24px));
            padding: 7px 8px 7px 12px;
            border: 1px solid rgba(190, 232, 255, .72);
            border-radius: 12px;
            background: #091728;
            color: #ffffff;
            font: 12px Arial, sans-serif;
            box-shadow: 0 0 12px rgba(50, 185, 255, .28);
        }

        .install-hint[hidden] { display: none; }

        .install-hint button {
            min-width: 34px;
            min-height: 34px;
            padding: 0 8px;
        }

        .install-hint .install-dismiss {
            width: 32px;
            min-width: 32px;
            height: 32px;
            min-height: 32px;
            padding: 0;
            border: 0;
            background: transparent;
            box-shadow: none;
            color: rgba(255,255,255,.78);
            font-size: 18px;
        }

        @media (max-width: 700px) {
            .move-controls { gap: 6px; }
            .action-controls { gap: 6px; }
            .top-controls { gap: 6px; }
            .touch-controls button { width: 48px; height: 64px; }
            .touch-controls button[data-move] { width: 100px; height: 90px; font-size: 50px; }
            .touch-controls button[data-fire] { width: 68px; height: 64px; font-size: 14px; }
            .touch-controls button[data-action="pause"],
            .touch-controls button[data-action="menu"] { width: 58px; height: 48px; font-size: 12px; }
            .overlay p { font-size: 14px; }
        }

        @media (max-width: 340px) {
            .move-controls { left: calc(env(safe-area-inset-left, 0px) + 3px); }
            .action-controls { right: calc(env(safe-area-inset-right, 0px) + 3px); }
        }
    </style>
</head>
<body>
    <aside class="install-hint" id="install-hint" hidden aria-live="polite">
        <span id="install-message"></span>
        <button id="install-button" type="button" hidden>Install</button>
        <button class="install-dismiss" id="install-dismiss" type="button" aria-label="Dismiss install hint">×</button>
    </aside>
    <main>
        <section class="stage" aria-label="Space Shooter game">
            <canvas id="game" width="600" height="600" aria-label="Game field"></canvas>
            <div class="overlay" id="paused-screen" hidden>
                <h2>PAUSED</h2>
            </div>
            <div class="overlay" id="menu-screen" hidden>
                <h2>MENU</h2>
                <div class="overlay-actions">
                    <button id="menu-resume-button" type="button">Resume</button>
                    <button id="menu-restart-button" type="button">Restart</button>
                    <button id="menu-end-button" type="button">End Game</button>
                    <button id="music-toggle-button" type="button" aria-pressed="true">Music On</button>
                </div>
            </div>
            <div class="overlay" id="game-over" hidden>
                <h2>GAME OVER</h2>
                <p id="final-score">Score: 0</p>
                <div class="overlay-actions">
                    <button id="restart-button" type="button">Play again</button>
                </div>
            </div>
        </section>

        <div class="controls">
            <div class="control-hint">◀ ▶ / ← → / A D Move · Space Fire · P Pause · M / Esc Menu</div>
            <div class="touch-controls move-controls" aria-label="Move controls">
                <button type="button" id="left-button" data-move="-1" aria-label="Hold to move left">◀</button>
                <button type="button" id="right-button" data-move="1" aria-label="Hold to move right">▶</button>
            </div>
            <div class="touch-controls action-controls" aria-label="Game controls">
                <button type="button" id="fire-button" data-fire aria-label="Hold to fire">Fire</button>
            </div>
            <div class="touch-controls top-controls" aria-label="Pause and menu controls">
                <button type="button" id="pause-button" data-action="pause" aria-label="Pause game" aria-pressed="false">Pause</button>
                <button type="button" id="menu-button" data-action="menu" aria-label="Open menu" aria-expanded="false">Menu</button>
            </div>
        </div>
    </main>
    <script src="game.js" defer></script>
    <script>
        (() => {
            const installHint = document.getElementById('install-hint');
            const installMessage = document.getElementById('install-message');
            const installButton = document.getElementById('install-button');
            const dismissButton = document.getElementById('install-dismiss');
            const dismissedKey = 'space-shooter-install-hint-dismissed-v1';
            let installPrompt = null;

            function isInstalled() {
                return window.matchMedia('(display-mode: standalone)').matches
                    || window.matchMedia('(display-mode: fullscreen)').matches
                    || window.navigator.standalone === true;
            }

            function showInstallHint(message, canInstall = false) {
                if (isInstalled() || localStorage.getItem(dismissedKey) === 'yes') return;
                installMessage.textContent = message;
                installButton.hidden = !canInstall;
                installHint.hidden = false;
            }

            const isAppleMobile = /iPhone|iPad|iPod/.test(navigator.userAgent)
                || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            if (isAppleMobile) {
                showInstallHint('Tap Share, then Add to Home Screen');
            }

            window.addEventListener('beforeinstallprompt', (event) => {
                event.preventDefault();
                installPrompt = event;
                showInstallHint('Install Space Shooter', true);
            });

            installButton.addEventListener('click', async () => {
                if (!installPrompt) return;
                installPrompt.prompt();
                await installPrompt.userChoice;
                installPrompt = null;
                installHint.hidden = true;
            });

            dismissButton.addEventListener('click', () => {
                localStorage.setItem(dismissedKey, 'yes');
                installHint.hidden = true;
            });

            window.addEventListener('appinstalled', () => {
                installHint.hidden = true;
                installPrompt = null;
            });

            if ('serviceWorker' in navigator && location.protocol !== 'file:') {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
                });
            }
        })();
    </script>
</body>
</html>
