<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-title" content="Space Shooter">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" href="icon.png">
    <title>Space Shooter</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Arial, sans-serif;
            background: #030711;
            color: #ffffff;
            font-synthesis: none;
        }

        * { box-sizing: border-box; }

        body {
            min-width: 0;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            display: grid;
            place-items: center;
            background: #030711;
        }

        main {
            width: min(calc(100vw - 20px), calc(100dvh - 92px), 600px);
        }

        .stage {
            position: relative;
            overflow: hidden;
            width: 100%;
            min-width: 0;
            margin-inline: auto;
            aspect-ratio: 1;
            background: #030711;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .overlay {
            position: absolute;
            inset: 0;
            display: grid;
            align-content: center;
            justify-items: center;
            gap: 8px;
            padding: 0;
            background: rgba(2, 6, 16, .58);
            backdrop-filter: blur(2px);
            text-align: center;
            pointer-events: none;
        }

        .overlay[hidden] { display: none; }

        .overlay h2 {
            margin: 0;
            color: #effaff;
            font: 700 clamp(38px, 8vw, 58px) Arial, sans-serif;
            line-height: 1;
            text-shadow: 0 0 18px rgba(73, 215, 255, .75);
        }

        .overlay p {
            max-width: 28rem;
            margin: 0;
            color: #ffffff;
            font: 16px Arial, sans-serif;
            text-shadow: 0 1px 4px #000000;
        }

        button {
            min-height: 38px;
            border: 1px solid rgba(206, 241, 255, .76);
            border-radius: 12px;
            background: #091728;
            color: #ffffff;
            font: 700 14px Arial, sans-serif;
            cursor: pointer;
            touch-action: manipulation;
            box-shadow: 0 0 12px rgba(50, 185, 255, .28), inset 0 0 10px rgba(52, 182, 255, .1);
            transition: background 120ms ease, box-shadow 120ms ease, transform 120ms ease;
        }

        button:hover { background: #102741; box-shadow: 0 0 18px rgba(50, 185, 255, .45); }
        button:active { transform: translateY(1px); }
        button:focus-visible { outline: 2px solid #ffffff; outline-offset: 2px; }

        .overlay button {
            min-width: 168px;
            min-height: 52px;
            padding: 0 22px;
            border-radius: 16px;
            border-color: #78e8ff;
            background: linear-gradient(180deg, #20bde9, #0873bb);
            color: #ffffff;
            font-size: 17px;
            box-shadow: 0 0 24px rgba(32, 189, 233, .52);
            pointer-events: auto;
        }

        .overlay button:hover { background: linear-gradient(180deg, #47d7fa, #118cda); }

        .overlay-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }

        .overlay .secondary-action {
            border-color: #ffffff;
            background: #000000;
            color: #ffffff;
        }

        .controls {
            min-height: 76px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 8px 4px 0;
            color: #ffffff;
            font: 13px Arial, sans-serif;
        }

        .touch-controls {
            display: flex;
            flex: 0 0 auto;
            gap: 12px;
        }

        .touch-controls button {
            width: 82px;
            height: 54px;
            padding: 0;
            border: 1px solid rgba(190, 232, 255, .72);
            border-radius: 16px;
            background: linear-gradient(180deg, #14283b, #081421);
            color: #ffffff;
            font: 700 15px Arial, sans-serif;
            box-shadow: 0 0 15px rgba(48, 166, 255, .22), inset 0 0 12px rgba(76, 197, 255, .09);
        }

        .touch-controls button[data-fire] {
            width: 108px;
            height: 58px;
            border-color: #ffe17a;
            background: linear-gradient(180deg, #ffcb4d, #df751e);
            color: #241500;
            font-size: 17px;
            box-shadow: 0 0 20px rgba(255, 177, 50, .46), inset 0 0 12px rgba(255, 255, 220, .28);
        }

        .touch-controls button[data-action="pause"] {
            width: 82px;
            border-color: #79e9ff;
            background: linear-gradient(180deg, #178eb3, #075374);
            box-shadow: 0 0 18px rgba(49, 214, 255, .38), inset 0 0 12px rgba(196, 248, 255, .16);
        }

        @media (max-width: 500px) {
            main { width: min(calc(100vw - 16px), calc(100dvh - 92px)); }
            .control-hint { display: none; }
            .controls { min-height: 76px; }
            .touch-controls { gap: 10px; }
            .touch-controls button { width: 76px; height: 52px; }
            .touch-controls button[data-fire] { width: 104px; height: 56px; }
            .touch-controls button[data-action="pause"] { width: 78px; }
            .overlay p { font-size: 14px; }
        }
    </style>
</head>
<body>
    <main>
        <section class="stage" aria-label="Space Shooter game">
            <canvas id="game" width="600" height="600" aria-label="Game field"></canvas>
            <div class="overlay" id="paused-screen" hidden>
                <h2>PAUSED</h2>
            </div>
            <div class="overlay" id="game-over" hidden>
                <h2>GAME OVER</h2>
                <p id="final-score">Score: 0</p>
                <div class="overlay-actions">
                    <button id="restart-button" type="button">Play again</button>
                </div>
            </div>
        </section>

        <footer class="controls">
            <div class="control-hint">Drag to move · ← → / A D · Space fire · P pause</div>
            <div class="touch-controls" aria-label="Touch controls">
                <button type="button" id="fire-button" data-fire aria-label="Hold to fire">Fire</button>
                <button type="button" id="pause-button" data-action="pause" aria-label="Pause game" aria-pressed="false">Pause</button>
            </div>
        </footer>
    </main>
    <script src="game.js" defer></script>
</body>
</html>
