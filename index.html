<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080d12">
    <title>Mini Shooter</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            background: #080d12;
            color: #e9f3f4;
            font-synthesis: none;
        }

        * { box-sizing: border-box; }

        body {
            min-width: 0;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 12px;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(18, 58, 65, .28), transparent 55%),
                #080d12;
        }

        main {
            width: min(100%, 600px);
        }

        header {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 16px;
            margin: 0 0 10px;
        }

        h1 {
            margin: 0;
            color: #f1f8f7;
            font-size: 1.6rem;
            font-weight: 700;
        }

        .eyebrow {
            margin: 0 0 5px;
            color: #83d9d2;
            font-size: .7rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .score {
            min-width: 90px;
            color: #ffffff;
            font-size: .8rem;
            text-align: right;
            text-transform: uppercase;
        }

        .score strong {
            display: block;
            color: #ffffff;
            font-size: 1.4rem;
            line-height: 1.1;
        }

        .hud {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .level-readout {
            min-width: 112px;
            color: #a8b8be;
            font-size: .7rem;
            text-align: right;
            text-transform: uppercase;
        }

        .level-readout strong {
            display: block;
            color: #83d9d2;
            font-size: 1rem;
        }

        .progress-track {
            width: 112px;
            height: 4px;
            margin-top: 5px;
            background: #27383e;
        }

        .progress-fill {
            width: 0;
            height: 100%;
            background: #83d9d2;
            transition: width 100ms linear;
        }

        .stage {
            position: relative;
            overflow: hidden;
            width: min(100%, 600px, calc(100dvh - 210px));
            min-width: 0;
            margin-inline: auto;
            aspect-ratio: 1;
            border: 1px solid #27383e;
            background: #030609;
            box-shadow: 0 20px 70px rgba(0, 0, 0, .38);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .overlay {
            position: absolute;
            inset: 0;
            display: grid;
            align-content: center;
            justify-items: center;
            gap: 14px;
            padding: 24px;
            background: rgba(3, 8, 11, .84);
            text-align: center;
        }

        .overlay[hidden] { display: none; }

        .overlay h2 {
            margin: 0;
            font-size: 2.4rem;
            line-height: 1;
        }

        .overlay p {
            max-width: 28rem;
            margin: 0;
            color: #adbec2;
            line-height: 1.55;
        }

        button {
            min-height: 44px;
            border: 1px solid #83d9d2;
            border-radius: 3px;
            background: #83d9d2;
            color: #071114;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            touch-action: manipulation;
        }

        button:hover { background: #a3eee5; }
        button:focus-visible { outline: 3px solid #ffe56b; outline-offset: 3px; }

        .overlay button { min-width: 150px; padding: 0 20px; }

        .overlay-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }

        .overlay .secondary-action {
            border-color: #52656b;
            background: #101a1e;
            color: #e9f3f4;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding-top: 14px;
            color: #9eafb4;
            font-size: .82rem;
        }

        .control-keys { color: #e9f3f4; }

        .touch-controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            flex: 0 0 auto;
        }

        .touch-controls button {
            width: 54px;
            height: 48px;
            padding: 0;
            border-color: #34494f;
            background: #101a1e;
            color: #e9f3f4;
            font-size: 1.1rem;
        }

        .touch-controls button[data-fire] {
            width: 84px;
            border-color: #bca642;
            color: #ffe56b;
        }

        .touch-controls button[data-action] {
            width: 48px;
            font-size: .72rem;
        }

        .touch-controls button[data-action="pause"] { width: 58px; }

        .touch-controls button[data-move] { font-size: 1.05rem; }

        @media (max-width: 480px) {
            body { padding: 8px; }
            main { width: 100%; }
            header { gap: 8px; }
            h1 { font-size: 1.3rem; }
            .hud { gap: 8px; }
            .score { min-width: 48px; font-size: .66rem; }
            .score strong { font-size: 1.15rem; }
            .level-readout { min-width: 72px; font-size: .62rem; }
            .level-readout strong { font-size: .9rem; }
            .progress-track { width: 72px; }
            .stage { width: min(100%, calc(100dvh - 210px)); }
            .controls { justify-content: center; gap: 8px; padding-top: 10px; }
            .control-hint { display: none; }
            .controls > div:last-child { display: none; }
            .touch-controls { gap: 8px; }
            .touch-controls { gap: 5px; }
            .touch-controls button { width: 38px; height: 44px; }
            .touch-controls button[data-move] { width: 40px; }
            .touch-controls button[data-fire] { width: 68px; }
            .touch-controls button[data-action] { width: 38px; }
            .touch-controls button[data-action="pause"] { width: 48px; }
            .overlay h2 { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <div>
                <p class="eyebrow">Arcade / 01</p>
                <h1>Mini Shooter</h1>
            </div>
            <div class="hud" aria-live="polite">
                <div class="score">Score<strong id="score">0</strong></div>
                <div class="level-readout">Level<strong id="level">1 / 15</strong><div class="progress-track"><div class="progress-fill" id="level-progress"></div></div></div>
            </div>
        </header>

        <section class="stage" aria-label="Mini Shooter game">
            <canvas id="game" width="600" height="600" aria-label="Game field"></canvas>
            <div class="overlay" id="start-screen">
                <p class="eyebrow">Arcade / Space Shooter</p>
                <h2>Launch</h2>
                <p>Clear incoming ships. Every four hits brings a faster wave.</p>
                <button id="start-button" type="button">Start game</button>
            </div>
            <div class="overlay" id="paused-screen" hidden>
                <p class="eyebrow">Flight suspended</p>
                <h2>Paused</h2>
                <p>Press P or resume when you are ready.</p>
                <button id="resume-button" type="button">Resume</button>
            </div>
            <div class="overlay" id="game-over" hidden>
                <p class="eyebrow">Mini Shooter</p>
                <h2>Game over</h2>
                <p id="final-score">Score: 0</p>
                <div class="overlay-actions">
                    <button id="restart-button" type="button">Play again</button>
                    <button class="secondary-action" id="game-menu-button" type="button">Menu</button>
                </div>
            </div>
        </section>

        <footer class="controls">
            <div class="control-hint"><span class="control-keys">← → / A D</span> move <span aria-hidden="true">·</span> <span class="control-keys">Space</span> fire <span aria-hidden="true">·</span> <span class="control-keys">P</span> pause</div>
            <div class="touch-controls" aria-label="Touch controls">
                <button type="button" data-move="-1" aria-label="Move left">←</button>
                <button type="button" data-move="1" aria-label="Move right">→</button>
                <button type="button" id="fire-button" data-fire aria-label="Hold to fire">Fire</button>
                <button type="button" id="pause-button" data-action="pause" aria-label="Pause game" aria-pressed="false">Pause</button>
                <button type="button" id="reset-button" data-action="reset" aria-label="Reset game">Reset</button>
                <button type="button" id="menu-button" data-action="menu" aria-label="Return to menu">Menu</button>
            </div>
            <div>Drag to move</div>
        </footer>
    </main>
    <script src="game.js" defer></script>
</body>
</html>
